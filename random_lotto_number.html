		<!DOCTYPE html>
		<html lang="ko">
			<head>
				<meta charset="UTF-8" />
				<meta name="viewport" content="width=device-width, initial-scale=1.0" />
				<title>로또 번호 분석기</title>
				<style>
					* {
						box-sizing: border-box;
						margin: 0;
						padding: 0;
					}

					body {
						font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

						min-height: 100vh;
						padding: 20px;
					}

					.container {
						max-width: 1200px;
						margin: 0 auto;
						background: rgba(255, 255, 255, 0.95);
						border-radius: 20px;
						box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
						overflow: hidden;
					}

					.header {
						background: linear-gradient(135deg, #ff6b6b, #ee5a24);
						color: white;
						padding: 30px;
						text-align: center;
					}

					.header h1 {
						font-size: 2.5rem;
						margin-bottom: 10px;
						text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
					}

					.header p {
						font-size: 1.1rem;
						opacity: 0.9;
					}

					.content {
						padding: 30px;
					}

					.section {
						margin-bottom: 40px;
						background: white;
						border-radius: 15px;
						padding: 25px;
						box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
					}

					.section h2 {
						color: #2c3e50;
						margin-bottom: 20px;
						font-size: 1.5rem;
						border-bottom: 3px solid #3498db;
						padding-bottom: 10px;
					}
					#originalData {
						padding: 0 80px;
					}
					.number-grid {
						display: grid;
						grid-template-columns: repeat(auto-fit, minmax(30px, 1fr));
						gap: 2px;
						margin: 10px 0;
					}
					.number-grid.hit {
						grid-template-columns: repeat(auto-fit, minmax(42px, 1fr));
					}

					/* 조합 결과에서 사용할 간격이 좁은 그리드 */
					.number-grid.compact {
						gap: 1px;
						margin: 5px 0;
					}

					.number-ball {
						width: 45px;
						height: 45px;
						border-radius: 50%;
						display: flex;
						align-items: center;
						justify-content: center;
						font-weight: bold;
						color: white;
						font-size: 0.95rem;
						cursor: pointer;
						transition: all 0.3s ease;
						border: 2px solid transparent;
					}

					/* 조합 결과에서 사용할 작은 번호 공 */
					.number-ball.small {
						width: 35px;
						height: 35px;
						font-size: 0.8rem;
					}

					.number-ball:hover {
						transform: scale(1.1);
						box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
					}

					.number-ball.common {
						background: #ff7171;
						border-color: #ff7171;
					}

					.number-ball.frequent {
						background: #fac400;
						border-color: #fac400;
					}

					.number-ball.normal {
						background: #56acd2;
						border-color: #56acd2;
					}

					.number-ball.rare {
						background: #aaaaaa;
						border-color: #aaaaaa;
					}

					/* 기존 로또 색상 클래스들 */
					.number-ball.yellowball {
						background: #fac400;
						border-color: #fac400;
					}

					.number-ball.blueball {
						background: #56acd2;
						border-color: #56acd2;
					}

					.number-ball.redball {
						background: #ff7171;
						border-color: #ff7171;
					}

					.number-ball.grayball {
						background: #aaaaaa;
						border-color: #aaaaaa;
					}

					.number-ball.greenball {
						background: #b0d840;
						border-color: #b0d840;
					}

					/* 네비게이션 링크 스타일 */
					.link_wrap {
						display: flex;
						gap: 20px;
						justify-content: center;
						margin-top: 20px;
					}

					.link_btn {
						display: flex;
						align-items: center;
						gap: 10px;
						padding: 15px 25px;
						border-radius: 25px;
						text-decoration: none;
						font-weight: 600;
						font-size: 1rem;
						transition: all 0.3s ease;
						position: relative;
						overflow: hidden;
						box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
					}

					.link_btn::before {
						content: '';
						position: absolute;
						top: 0;
						left: -100%;
						width: 100%;
						height: 100%;
						background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
						transition: left 0.5s;
					}

					.link_btn:hover::before {
						left: 100%;
					}

					.link_btn i {
						font-size: 1.2rem;
						transition: transform 0.3s ease;
					}

					.link_btn:hover i {
						transform: scale(1.2);
					}

					.home-btn {
						background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
						color: white;
					}

					.home-btn:hover {
						background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
						transform: translateY(-3px);
						box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
					}

					.filter-btn {
						background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
						color: white;
					}

					.filter-btn:hover {
						background: linear-gradient(135deg, #e085e8 0%, #e54b5f 100%);
						transform: translateY(-3px);
						box-shadow: 0 8px 25px rgba(240, 147, 251, 0.4);
					}

					.data-set {
						background: #f8f9fa;
						border-radius: 8px;
						padding: 8px;
						margin: 3px 0;
						border-left: 3px solid #3498db;
					}

					.data-set h3 {
						color: #2c3e50;
						margin-bottom: 3px;
						font-size: 0.9rem;
					}

					.controls {
						display: flex;
						gap: 15px;
						flex-wrap: wrap;
						margin: 20px 0;
					}

					.btn {
						padding: 12px 24px;
						border: none;
						border-radius: 25px;
						font-size: 1rem;
						font-weight: bold;
						cursor: pointer;
						transition: all 0.3s ease;
						text-transform: uppercase;
						letter-spacing: 1px;
					}

					.btn-primary {
						background: linear-gradient(135deg, #3498db, #2980b9);
						color: white;
					}

					.btn-primary:hover {
						background: linear-gradient(135deg, #2980b9, #1f5f8b);
						transform: translateY(-2px);
						box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
					}

					.btn-success {
						background: linear-gradient(135deg, #2ecc71, #27ae60);
						color: white;
					}

					.btn-success:hover {
						background: linear-gradient(135deg, #27ae60, #1e8449);
						transform: translateY(-2px);
						box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
					}

					.btn-warning {
						background: linear-gradient(135deg, #f39c12, #e67e22);
						color: white;
					}

					.btn-warning:hover {
						background: linear-gradient(135deg, #e67e22, #d35400);
						transform: translateY(-2px);
						box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
					}

					.result-container {
						display: grid;
						grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
						gap: 20px;
						margin-top: 20px;
					}

					.result-card {
						background: linear-gradient(135deg, #667eea, #764ba2);
						color: white;
						padding: 20px;
						border-radius: 15px;
						text-align: center;
						box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
					}

					.result-card h3 {
						margin-bottom: 15px;
						font-size: 1.2rem;
					}

					.stats {
						display: grid;
						grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
						gap: 20px;
						margin: 20px 0;
					}

					.stat-card {
						background: white;
						padding: 20px;
						border-radius: 10px;
						text-align: center;
						box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
					}

					.stat-number {
						font-size: 2rem;
						font-weight: bold;
						color: #3498db;
						margin-bottom: 5px;
					}

					.stat-label {
						color: #7f8c8d;
						font-size: 0.9rem;
					}

					.frequency-chart {
						background: white;
						padding: 20px;
						border-radius: 10px;
						margin: 20px 0;
					}

					.chart-bar {
						height: 30px;
						background: linear-gradient(90deg, #3498db, #2980b9);
						border-radius: 15px;
						margin: 5px 0;
						position: relative;
						overflow: hidden;
					}

					.chart-label {
						position: absolute;
						left: 10px;
						top: 50%;
						transform: translateY(-50%);
						color: white;
						font-weight: bold;
						z-index: 1;
					}

					.data-form {
						background: #f8f9fa;
						border-radius: 10px;
						padding: 20px;
						margin: 20px 0;
						border: 2px solid #3498db;
					}

					.data-form h3 {
						color: #2c3e50;
						margin-bottom: 15px;
					}

					.input-group {
						display: flex;
						gap: 10px;
						margin-bottom: 15px;
						flex-wrap: wrap;
					}

					.number-input {
						width: 60px;
						height: 40px;
						border: 2px solid #3498db;
						border-radius: 8px;
						text-align: center;
						font-size: 1rem;
						font-weight: bold;
					}

					.number-input:focus {
						outline: none;
						border-color: #2980b9;
						box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
					}

					.data-set {
						position: relative;
					}

					.delete-btn {
						position: absolute;
						top: 10px;
						right: 10px;
						background: #e74c3c;
						color: white;
						border: none;
						border-radius: 50%;
						width: 30px;
						height: 30px;
						cursor: pointer;
						font-size: 0.8rem;
						transition: all 0.3s ease;
					}

					.delete-btn:hover {
						background: #c0392b;
						transform: scale(1.1);
					}

					.heatmap-legend {
						display: flex;
						flex-wrap: wrap;
						gap: 15px;
						margin-bottom: 20px;
						padding: 15px;
						background: #f8f9fa;
						border-radius: 10px;
						border: 1px solid #e9ecef;
					}

					.legend-item {
						display: flex;
						align-items: center;
						gap: 8px;
						font-size: 0.9rem;
						color: #495057;
					}

					.legend-ball {
						width: 20px;
						height: 20px;
						border-radius: 50%;
						border: 2px solid transparent;
					}

					.legend-ball.common {
						background: #ff7171;
						border-color: #ff7171;
					}

					.legend-ball.frequent {
						background: #fac400;
						border-color: #fac400;
					}

					.legend-ball.normal {
						background: #56acd2;
						border-color: #56acd2;
					}

					.legend-ball.rare {
						background: #aaaaaa;
						border-color: #aaaaaa;
					}

					.fix-number-section {
						margin: 20px 0;
						padding: 20px;
						background: #f8f9fa;
						border-radius: 10px;
						border: 1px solid #e9ecef;
					}

					.fix-number-section h3 {
						color: #2c3e50;
						margin-bottom: 15px;
						font-size: 1.2rem;
					}

					.fix-number-grid {
						display: grid;
						grid-template-columns: repeat(auto-fit, minmax(45px, 1fr));
						gap: 4px;
						margin-bottom: 15px;
					}

					.fix-number-ball {
						width: 45px;
						height: 45px;
						border-radius: 50%;
						display: flex;
						align-items: center;
						justify-content: center;
						font-weight: bold;
						color: white;
						font-size: 0.95rem;
						cursor: pointer;
						transition: all 0.3s ease;
						border: 2px solid transparent;
					}

					.fix-number-ball:hover {
						transform: scale(1.1);
						box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
					}

					.fix-number-ball.selected {
						border: 3px solid #333;
						box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
					}

					/* 고정수 색상 클래스들 */
					.fix-number-ball.yellowball {
						background: #fac400;
						border-color: #fac400;
					}

					.fix-number-ball.blueball {
						background: #56acd2;
						border-color: #56acd2;
					}

					.fix-number-ball.redball {
						background: #ff7171;
						border-color: #ff7171;
					}

					.fix-number-ball.grayball {
						background: #aaaaaa;
						border-color: #aaaaaa;
					}

					.fix-number-ball.greenball {
						background: #b0d840;
						border-color: #b0d840;
					}

					/* 모달창 스타일 */
					.overlay {
						position: fixed;
						display: block;
						left: 0;
						right: 0;
						bottom: 0;
						top: 0;
						background: rgba(0, 0, 0, 0.6);
						backdrop-filter: blur(5px);
						opacity: 0;
						visibility: hidden;
						transition: 0.3s;
						z-index: 100;
					}

					.overlay.visible {
						opacity: 1;
						visibility: visible;
					}

					.overlay .inner {
						position: absolute;
						border: 1px solid #2f4858;
						border-radius: 30px;
						width: 950px;
						left: 50%;
						top: 50%;
						transform: translate(-50%, -50%);
						padding: 30px;
						z-index: 1000;
						background: #e3e3e2;
					}

					.overlay .wrapper {
						padding: 30px;
					}

					.overlay .wrapper .ball {
						display: inline-block;
						margin: 8px;
						cursor: pointer;
						width: 60px;
						height: 60px;
						line-height: 60px;
					}

					.overlay .inner .close {
						width: 60px;
						height: 60px;
						position: absolute;
						right: 10px;
						top: 10px;
					}

					.overlay .inner .close i {
						font-size: 30px;
						color: #333333;
						transition: 0.3s;
					}

					.overlay .inner .close i:hover {
						color: #fb81d2;
					}

					.overlay .btn {
						position: absolute;
						right: 40px;
						bottom: 10px;
						width: 100px;
						height: 40px;
						font-size: 20px;
						border-radius: 40px;
						background: #ffd22d;
						transition: 300ms;
					}

					.overlay .btn:hover {
						background: #fecc18;
						color: #e3e3e2;
					}

					.overlay .wrapper .ball:hover {
						box-sizing: border-box;
						border: 1px solid #00c6cf;
					}

					.overlay .wrapper .ball.selected {
						background: #ff2c56;
						border-color: #ff2c56;
					}

					@media (max-width: 768px) {
						.container {
							margin: 10px;
							border-radius: 15px;
						}

						.header h1 {
							font-size: 2rem;
						}

						.controls {
							flex-direction: column;
						}

						.btn {
							width: 100%;
						}

						.input-group {
							justify-content: center;
						}
					}
				</style>
			</head>
			<body>
				<div class="container">
					<div class="content">
						<!-- 번호 히트맵 섹션 -->
						<div class="section">
							<h2>🔥 번호 히트맵</h2>
							<div class="controls">
								<button class="btn btn-primary" onclick="loadRecentData()">최근 5주 데이터 추가</button>
								<button class="btn btn-warning" onclick="loadRecentDataOnly()">최근 5주 데이터만 사용</button>
							</div>
							<div class="heatmap-legend">
								<div class="legend-item">
									<div class="legend-ball common"></div>
									<span>5회 이상 출현 (핫 넘버)</span>
								</div>
								<div class="legend-item">
									<div class="legend-ball frequent"></div>
									<span>3-4회 출현 (자주 출현)</span>
								</div>
								<div class="legend-item">
									<div class="legend-ball normal"></div>
									<span>1-2회 출현 (보통)</span>
								</div>
								<div class="legend-item">
									<div class="legend-ball rare"></div>
									<span>0회 출현 (콜드 넘버)</span>
								</div>
								<div class="legend-item" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #e9ecef">
									<span style="font-size: 0.9rem; color: #666">🔄 최근 5주 데이터가 자동으로 로드됩니다</span>
								</div>
							</div>
							<div class="number-grid hit" id="heatmap"></div>
						</div>

						<!-- 원본 데이터 섹션 -->
						<div class="section">
							<h2>📋 원본 데이터</h2>
							<div class="controls">
								<button class="btn btn-success" onclick="openAddDataModal()">데이터 추가</button>
								<button class="btn btn-warning" onclick="clearAllData()">전체 삭제</button>
							</div>
							<div id="originalData"></div>
						</div>

						<!-- 통계 섹션 -->
						<div class="section">
							<h2>📊 번호 통계</h2>
							<div class="stats">
								<div class="stat-card">
									<div class="stat-number" id="frequentCount">0</div>
									<div class="stat-label">자주 나오는 번호</div>
								</div>
								<div class="stat-card">
									<div class="stat-number" id="repeatCount">0</div>
									<div class="stat-label">반복수</div>
								</div>
								<div class="stat-card">
									<div class="stat-number" id="generatedCount">0</div>
									<div class="stat-label">생성된 조합</div>
								</div>
							</div>
						</div>

						<!-- 자주 나오는 번호 섹션 -->
						<div class="section">
							<h2>⭐ 자주 나오는 번호</h2>
							<div class="number-grid" id="frequentNumbers"></div>
						</div>

						<!-- 반복수 섹션 -->
						<div class="section">
							<h2>🔄 반복수</h2>
							<div class="number-grid" id="repeatNumbers"></div>
						</div>

						<!-- 번호 생성 섹션 -->
						<div class="section">
							<h2>🎲 번호 생성</h2>
							<div class="fix-number-section">
								<h3>고정수 설정</h3>
								<div class="controls">
									<button class="btn btn-primary" id="fixNumberBtn" onclick="openFixNumberModal()">고정수 선택</button>
									<button class="btn btn-success" onclick="clearFixNumbers()">고정수 초기화</button>
								</div>
								<div id="fixNumberSets"></div>
							</div>
							<div class="fix-number-section">
								<h3>선택수 설정</h3>
								<div class="controls">
									<button class="btn btn-primary" onclick="openSelectNumberModal()">선택수 선택</button>
									<button class="btn btn-success" onclick="clearSelectNumbers()">선택수 초기화</button>
								</div>
								<div id="selectNumberSets"></div>
							</div>
							<div class="controls">
								<button class="btn btn-primary" onclick="generateNumbers()">번호 생성</button>
								<button class="btn btn-success" onclick="generateMultiple()">다중 생성</button>
								<button class="btn btn-warning" onclick="clearResults()">결과 초기화</button>
							</div>
							<div class="result-container" id="generatedResults"></div>
						</div>
					</div>
				</div>

				<!-- 고정수 선택 모달창 -->
				<div class="overlay" id="fixNumberOverlay">
					<div class="inner">
						<h2>고정수 선택</h2>
						<div class="wrapper" id="fixNumberModalGrid"></div>
						<button class="close" onclick="closeFixNumberModal()">
							<i class="fa-regular fa-circle-xmark"></i>
						</button>
						<button class="btn" onclick="confirmFixNumberSelection()">완료</button>
					</div>
				</div>

				<!-- 선택수 선택 모달창 -->
				<div class="overlay" id="selectNumberOverlay">
					<div class="inner">
						<h2>선택수 선택</h2>
						<div class="wrapper" id="selectNumberModalGrid"></div>
						<button class="close" onclick="closeSelectNumberModal()">
							<i class="fa-regular fa-circle-xmark"></i>
						</button>
						<button class="btn" onclick="confirmSelectNumberSelection()">완료</button>
					</div>
				</div>

				<!-- 데이터 추가 모달창 -->
				<div class="overlay" id="addDataOverlay">
					<div class="inner">
						<h2>데이터 추가</h2>
						<div class="wrapper" id="addDataModalGrid"></div>
						<button class="close" onclick="closeAddDataModal()">
							<i class="fa-regular fa-circle-xmark"></i>
						</button>
						<div style="position: absolute; bottom: 10px; right: 10px; display: flex; gap: 10px">
							<button class="btn" onclick="confirmAddDataSelection()">완료</button>
						</div>
					</div>
				</div>

				<script>
					// 원본 데이터
					let allArrays = [];

					// 고정 번호
					const fixnum = [];

					let randomNum1 = [];

					let generatedCount = 0;
					let selectedFixNumbers = new Set();
					let fixNumberSets = [];
					let modalSelectedNumbers = new Set();
					let modalSelectNumbers = new Set();
					let modalAddDataNumbers = new Set();

					// 유틸리티 함수들
					function findCommonNumbers(...args) {
						return args.reduce((common, currentArray) => {
							return common.filter(number => currentArray.includes(number));
						});
					}

					function findTheMostNumbers(...args) {
						let answer = [];
						let max = Number.MIN_SAFE_INTEGER;
						const numbers = new Map();
						const sumArr = [...args.flat()];

						for (let x of sumArr) {
							if (numbers.has(x)) {
								numbers.set(x, numbers.get(x) + 1);
								if (numbers.get(x) > max) max = numbers.get(x);
							} else numbers.set(x, 1);
						}

						numbers.forEach((el, idx) => {
							if (el >= max || el >= max - 1) {
								answer.push(idx);
							}
						});
						return answer.sort((a, b) => a - b);
					}

					// 반복수 찾기 함수 (원본 데이터와 최근 데이터 간의 중복 번호)
					function findRepeatNumbers(originalData, recentData) {
						const originalNumbers = new Set(originalData.flat());
						const recentNumbers = new Set(recentData.flat());
						const repeatNumbers = [];

						console.log('원본 번호들:', Array.from(originalNumbers));
						console.log('최근 번호들:', Array.from(recentNumbers));

						originalNumbers.forEach(num => {
							if (recentNumbers.has(num)) {
								repeatNumbers.push(num);
								console.log(`반복수 발견: ${num}`);
							}
						});

						const result = repeatNumbers.sort((a, b) => a - b);
						console.log('최종 반복수:', result);
						return result;
					}

					function getRandomElement(array) {
						const randomIndex = Math.floor(Math.random() * array.length);
						return array[randomIndex];
					}

					function addUniqueRandomElements(set, count, array) {
						while (set.size < count) {
							set.add(getRandomElement(array));
						}
					}

					function getResultNum() {
						const results = [];

						console.log('고정수 세트 개수:', fixNumberSets.length); // 디버깅용
						console.log('고정수 세트:', fixNumberSets); // 디버깅용

						// 고정수 세트가 있는 경우 - 각 고정수 세트로 6개씩 생성 (총 30개 카드)
						if (fixNumberSets.length > 0) {
							fixNumberSets.forEach((fixNumbers, setIndex) => {
								console.log(`고정수 세트 ${setIndex + 1}:`, fixNumbers); // 디버깅용

								// 각 고정수 세트로 6개 조합 생성
								for (let i = 0; i < 6; i++) {
									const uniqueNumbers = new Set(fixNumbers);
									addUniqueRandomElements(uniqueNumbers, 6, randomNum1);
									const result = Array.from(uniqueNumbers).sort((a, b) => a - b);
									results.push(result);
								}
							});
						} else {
							// 고정수 세트가 없는 경우 - 기존 방식으로 30개씩 생성
							fixnum.forEach((arr, setIndex) => {
								// 각 고정수 배열로 30개씩 생성
								for (let i = 0; i < 30; i++) {
									const uniqueNumbers = new Set(arr);
									addUniqueRandomElements(uniqueNumbers, 6, randomNum1);
									const result = Array.from(uniqueNumbers).sort((a, b) => a - b);
									results.push(result);
								}
							});
						}

						console.log('최종 결과 개수:', results.length); // 디버깅용
						return results;
					}

					// UI 렌더링 함수들
					function renderOriginalData() {
						const container = document.getElementById('originalData');
						container.innerHTML = '';

						allArrays.forEach((arr, index) => {
							const dataSet = document.createElement('div');
							dataSet.className = 'data-set';
							dataSet.innerHTML = `
                    <button class="delete-btn" onclick="deleteData(${index})" title="삭제">×</button>
                    <h3>데이터 ${index + 1}</h3>
                    <div class="number-grid">
                        ${arr.map(num => `<div class="number-ball ${getBallColorClass(num)}">${num}</div>`).join('')}
                    </div>
                `;
							container.appendChild(dataSet);
						});
					}

					// 번호별 색상 클래스 반환 함수
					function getBallColorClass(number) {
						if (number < 11) return 'yellowball';
						if (number < 21) return 'blueball';
						if (number < 31) return 'redball';
						if (number < 41) return 'grayball';
						if (number < 46) return 'greenball';
						return 'normal';
					}

					function renderCommonNumbers() {
						const commonNumbers = findCommonNumbers(...allArrays);
						const container = document.getElementById('commonNumbers');
						container.innerHTML = '';

						commonNumbers.forEach(num => {
							const ball = document.createElement('div');
							ball.className = `number-ball ${getBallColorClass(num)}`;
							ball.textContent = num;
							container.appendChild(ball);
						});

						document.getElementById('commonCount').textContent = commonNumbers.length;
					}

					function renderFrequentNumbers() {
						const frequentNumbers = findTheMostNumbers(...allArrays);
						const container = document.getElementById('frequentNumbers');
						container.innerHTML = '';

						frequentNumbers.forEach(num => {
							const ball = document.createElement('div');
							ball.className = `number-ball ${getBallColorClass(num)}`;
							ball.textContent = num;
							container.appendChild(ball);
						});

						document.getElementById('frequentCount').textContent = frequentNumbers.length;
					}

					function renderRepeatNumbers() {
						// 원본 데이터 (최초 13개 세트)
						const originalData = allArrays.slice(0, 13);
						// 최근 추가된 데이터 (13개 이후)
						const recentData = allArrays.slice(13);

						console.log('원본 데이터:', originalData);
						console.log('최근 데이터:', recentData);
						console.log('최근 데이터 개수:', recentData.length);

						let repeatNumbers = [];
						if (recentData.length > 0) {
							repeatNumbers = findRepeatNumbers(originalData, recentData);
							console.log('반복수:', repeatNumbers);
						} else {
							// 최근 데이터가 없을 때는 원본 데이터에서 28, 38을 반복수로 표시
							const originalNumbers = new Set(originalData.flat());
							if (originalNumbers.has(28)) repeatNumbers.push(28);
							if (originalNumbers.has(38)) repeatNumbers.push(38);
							console.log('반복수 (28, 38):', repeatNumbers);
						}

						const container = document.getElementById('repeatNumbers');
						if (container) {
							container.innerHTML = '';

							repeatNumbers.forEach(num => {
								const ball = document.createElement('div');
								ball.className = `number-ball ${getBallColorClass(num)}`;
								ball.textContent = num;
								container.appendChild(ball);
							});
						}

						document.getElementById('repeatCount').textContent = repeatNumbers.length;
					}

					function renderHeatmap() {
						const container = document.getElementById('heatmap');
						container.innerHTML = '';

						const frequencyMap = new Map();
						allArrays.flat().forEach(num => {
							frequencyMap.set(num, (frequencyMap.get(num) || 0) + 1);
						});

						for (let i = 1; i <= 45; i++) {
							const ball = document.createElement('div');
							const frequency = frequencyMap.get(i) || 0;

							// 출현 빈도에 따른 색상 클래스 적용
							if (frequency >= 5) {
								ball.className = 'number-ball common';
							} else if (frequency >= 3) {
								ball.className = 'number-ball frequent';
							} else if (frequency >= 1) {
								ball.className = 'number-ball normal';
							} else {
								ball.className = 'number-ball rare';
							}

							ball.textContent = i;
							ball.title = `번호 ${i}: ${frequency}회 출현`;
							container.appendChild(ball);
						}
					}

					function renderGeneratedResults(results) {
						const container = document.getElementById('generatedResults');

						// 고정수 세트가 있는 경우 - 각 고정수 세트별로 6개씩 조합을 만들어서 30개 카드 생성
						if (fixNumberSets.length > 0 && results.length > 0) {
							const combinationsPerSet = 6; // 각 고정수 세트당 6개 조합
							const totalCards = 30; // 총 30개 카드

							// 30개 카드 생성
							for (let cardIndex = 0; cardIndex < totalCards; cardIndex++) {
								const card = document.createElement('div');
								card.className = 'result-card';

								// 각 카드에 5개 고정수 세트의 조합들을 배치
								let cardHTML = `<h3>조합 ${cardIndex + 1}</h3>`;

								// 각 고정수 세트에서 하나씩 조합을 가져와서 카드에 배치
								for (let setIndex = 0; setIndex < fixNumberSets.length; setIndex++) {
									const resultIndex = setIndex * combinationsPerSet + (cardIndex % combinationsPerSet);
									if (resultIndex < results.length) {
										const result = results[resultIndex];
										cardHTML += `
											<div style="margin-bottom: 10px; padding: 8px; background: rgba(255,255,255,0.1); border-radius: 6px;">
												<h4 style="margin-bottom: 5px; font-size: 0.8rem; opacity: 0.8;">고정수 세트 ${setIndex + 1} 조합</h4>
												<div class="number-grid compact">
													${result.map(num => `<div class="number-ball small ${getBallColorClass(num)}">${num}</div>`).join('')}
												</div>
											</div>
										`;
									}
								}

								card.innerHTML = cardHTML;
								container.appendChild(card);
							}
						} else {
							// 고정수 세트가 없는 경우 - 30개씩 묶어서 카드 생성
							const setsPerCard = 30;
							for (let i = 0; i < results.length; i += setsPerCard) {
								const card = document.createElement('div');
								card.className = 'result-card';

								const cardResults = results.slice(i, i + setsPerCard);
								let cardHTML = `<h3>조합 ${i + 1}~${i + cardResults.length} (${cardResults.length}개)</h3>`;

								cardResults.forEach((result, index) => {
									cardHTML += `
										<div style="margin-bottom: 10px; padding: 8px; background: rgba(255,255,255,0.1); border-radius: 6px;">
											<h4 style="margin-bottom: 5px; font-size: 0.8rem; opacity: 0.8;">조합 ${i + index + 1}</h4>
											<div class="number-grid compact">
												${result.map(num => `<div class="number-ball small ${getBallColorClass(num)}">${num}</div>`).join('')}
											</div>
										</div>
									`;
								});

								card.innerHTML = cardHTML;
								container.appendChild(card);
							}
						}

						generatedCount += results.length;
						document.getElementById('generatedCount').textContent = generatedCount;
					}

					// 이벤트 핸들러들
					function generateNumbers() {
						const results = getResultNum();
						console.log('생성된 결과:', results); // 디버깅용
						console.log('결과 개수:', results.length); // 디버깅용
						renderGeneratedResults(results);
					}

					function generateMultiple() {
						const results = [];
						for (let i = 0; i < 5; i++) {
							results.push(...getResultNum());
						}
						renderGeneratedResults(results);
					}

					function clearResults() {
						document.getElementById('generatedResults').innerHTML = '';
						generatedCount = 0;
						document.getElementById('generatedCount').textContent = '0';
					}

					// 데이터 추가 모달창 열기
					function openAddDataModal() {
						const overlay = document.getElementById('addDataOverlay');
						const container = document.getElementById('addDataModalGrid');

						// 모달창에 1-45번 공 생성
						container.innerHTML = '';
						for (let i = 1; i <= 45; i++) {
							const ball = document.createElement('div');
							ball.className = `ball ${getBallColorClass(i)}`;
							ball.textContent = i;
							ball.onclick = () => toggleAddDataNumber(i, ball);
							container.appendChild(ball);
						}

						overlay.classList.add('visible');
					}

					// 데이터 추가 모달창 닫기
					function closeAddDataModal() {
						const overlay = document.getElementById('addDataOverlay');
						overlay.classList.remove('visible');
						modalAddDataNumbers.clear();
					}

					// 데이터 추가 모달창에서 번호 토글
					function toggleAddDataNumber(number, ballElement) {
						if (modalAddDataNumbers.has(number)) {
							modalAddDataNumbers.delete(number);
							ballElement.classList.remove('selected');
						} else {
							if (modalAddDataNumbers.size < 6) {
								modalAddDataNumbers.add(number);
								ballElement.classList.add('selected');
							} else {
								Swal.fire({
									icon: 'warning',
									title: '번호 제한',
									text: '로또 번호는 6개까지 선택할 수 있습니다.',
									timer: 2000,
									showConfirmButton: false,
								});
							}
						}
					}

					// 선택된 번호들 초기화
					function clearSelectedNumbers() {
						modalAddDataNumbers.clear();
						// 모달창의 모든 선택된 공들을 해제
						const selectedBalls = document.querySelectorAll('#addDataModalGrid .ball.selected');
						selectedBalls.forEach(ball => {
							ball.classList.remove('selected');
						});
					}

					// 데이터 추가 모달창에서 선택 확인
					function confirmAddDataSelection() {
						if (modalAddDataNumbers.size !== 6) {
							Swal.fire({
								icon: 'warning',
								title: '번호 부족',
								text: '정확히 6개의 번호를 선택해주세요.',
								timer: 2000,
								showConfirmButton: false,
							});
							return;
						}

						const addNumbers = Array.from(modalAddDataNumbers).sort((a, b) => a - b);

						// 바로 데이터 추가
						allArrays.push(addNumbers);
						modalAddDataNumbers.clear();
						closeAddDataModal();
						updateAllDisplays();

						Swal.fire({
							icon: 'success',
							title: '데이터 추가 완료',
							text: '새로운 데이터가 추가되었습니다.',
							timer: 1500,
							showConfirmButton: false,
						});
					}

					function deleteData(index) {
						if (confirm(`데이터 ${index + 1}을 삭제하시겠습니까?`)) {
							allArrays.splice(index, 1);
							updateAllDisplays();
						}
					}

					function clearAllData() {
						if (confirm('모든 원본 데이터를 삭제하시겠습니까?')) {
							allArrays = [];
							updateAllDisplays();
						}
					}

					function updateAllDisplays() {
						renderOriginalData();
						renderFrequentNumbers();
						renderRepeatNumbers();
						// renderHeatmap(); // 히트맵은 별도로 처리
						renderFixNumberSets();
						renderSelectNumbers();
					}

					// 모달창 열기
					function openFixNumberModal() {
						const overlay = document.getElementById('fixNumberOverlay');
						const container = document.getElementById('fixNumberModalGrid');

						// 모달창에 1-45번 공 생성
						container.innerHTML = '';
						for (let i = 1; i <= 45; i++) {
							const ball = document.createElement('div');
							ball.className = `ball ${getBallColorClass(i)}`;
							ball.textContent = i;
							ball.onclick = () => toggleModalNumber(i, ball);
							container.appendChild(ball);
						}

						overlay.classList.add('visible');
					}

					// 모달창 닫기
					function closeFixNumberModal() {
						const overlay = document.getElementById('fixNumberOverlay');
						overlay.classList.remove('visible');
						modalSelectedNumbers.clear();
					}

					// 모달창에서 번호 토글
					function toggleModalNumber(number, ballElement) {
						if (modalSelectedNumbers.has(number)) {
							modalSelectedNumbers.delete(number);
							ballElement.classList.remove('selected');
						} else {
							if (modalSelectedNumbers.size < 6) {
								modalSelectedNumbers.add(number);
								ballElement.classList.add('selected');
							} else {
								Swal.fire({
									icon: 'warning',
									title: '고정수 제한',
									text: '고정수는 최대 6개까지 선택할 수 있습니다.',
									timer: 2000,
									showConfirmButton: false,
								});
							}
						}
					}

					// 모달창에서 선택 확인
					function confirmFixNumberSelection() {
						if (modalSelectedNumbers.size === 0) {
							Swal.fire({
								icon: 'warning',
								title: '고정수 미선택',
								text: '고정수를 선택해주세요.',
								timer: 2000,
								showConfirmButton: false,
							});
							return;
						}

						const fixNumbers = Array.from(modalSelectedNumbers).sort((a, b) => a - b);

						// 바로 고정수 세트에 추가
						fixNumberSets.push(fixNumbers);
						modalSelectedNumbers.clear();
						closeFixNumberModal();
						renderFixNumberSets();

						Swal.fire({
							icon: 'success',
							title: '고정수 세트 추가 완료',
							text: `고정수 세트 ${fixNumberSets.length}이 추가되었습니다.`,
							timer: 1500,
							showConfirmButton: false,
						});
					}

					// 선택수 모달창 열기
					function openSelectNumberModal() {
						const overlay = document.getElementById('selectNumberOverlay');
						const container = document.getElementById('selectNumberModalGrid');

						// 모달창에 1-45번 공 생성
						container.innerHTML = '';
						for (let i = 1; i <= 45; i++) {
							const ball = document.createElement('div');
							ball.className = `ball ${getBallColorClass(i)}`;
							ball.textContent = i;
							ball.onclick = () => toggleSelectModalNumber(i, ball);
							container.appendChild(ball);
						}

						overlay.classList.add('visible');
					}

					// 선택수 모달창 닫기
					function closeSelectNumberModal() {
						const overlay = document.getElementById('selectNumberOverlay');
						overlay.classList.remove('visible');
						modalSelectNumbers.clear();
					}

					// 선택수 모달창에서 번호 토글
					function toggleSelectModalNumber(number, ballElement) {
						if (modalSelectNumbers.has(number)) {
							modalSelectNumbers.delete(number);
							ballElement.classList.remove('selected');
						} else {
							modalSelectNumbers.add(number);
							ballElement.classList.add('selected');
						}
					}

					// 선택수 모달창에서 선택 확인
					function confirmSelectNumberSelection() {
						if (modalSelectNumbers.size < 6) {
							Swal.fire({
								icon: 'warning',
								title: '선택수 부족',
								text: '선택수는 6개 이상 선택해야 합니다.',
								timer: 2000,
								showConfirmButton: false,
							});
							return;
						}

						const selectNumbers = Array.from(modalSelectNumbers).sort((a, b) => a - b);

						// 바로 선택수 설정
						randomNum1 = selectNumbers;
						modalSelectNumbers.clear();
						closeSelectNumberModal();
						renderSelectNumbers();

						Swal.fire({
							icon: 'success',
							title: '선택수 설정 완료',
							text: `${selectNumbers.length}개의 선택수가 설정되었습니다.`,
							timer: 1500,
							showConfirmButton: false,
						});
					}

					// 고정수 세트 렌더링
					function renderFixNumberSets() {
						const container = document.getElementById('fixNumberSets');
						container.innerHTML = '';

						// 고정수 세트가 있으면 버튼 텍스트 변경
						const fixNumberBtn = document.getElementById('fixNumberBtn');
						if (fixNumberSets.length > 0) {
							fixNumberBtn.textContent = '고정수 추가';
						} else {
							fixNumberBtn.textContent = '고정수 선택';
						}

						fixNumberSets.forEach((set, index) => {
							const setDiv = document.createElement('div');
							setDiv.className = 'fix-number-set';
							setDiv.style.cssText = `
								margin: 10px 0;
								padding: 15px;
								background: white;
								border-radius: 8px;
								border: 1px solid #ddd;
								display: flex;
								align-items: center;
								justify-content: space-between;
							`;

							setDiv.innerHTML = `
								<div>
									<strong>세트 ${index + 1}:</strong>
									<div class="number-grid" style="display: inline-flex; gap: 5px; margin-left: 10px;">
										${set.map(num => `<div class="number-ball ${getBallColorClass(num)}" style="width: 30px; height: 30px; font-size: 0.8rem;">${num}</div>`).join('')}
									</div>
								</div>
								<button class="btn btn-warning" onclick="removeFixNumberSet(${index})" style="padding: 5px 10px; font-size: 0.8rem;">삭제</button>
							`;

							container.appendChild(setDiv);
						});
					}

					// 고정수 세트 삭제
					function removeFixNumberSet(index) {
						fixNumberSets.splice(index, 1);
						renderFixNumberSets();

						Swal.fire({
							icon: 'success',
							title: '세트 삭제',
							text: '고정수 세트가 삭제되었습니다.',
							timer: 1500,
							showConfirmButton: false,
						});
					}

					// 선택수 렌더링
					function renderSelectNumbers() {
						const container = document.getElementById('selectNumberSets');
						container.innerHTML = '';

						if (randomNum1.length > 0) {
							const setDiv = document.createElement('div');
							setDiv.className = 'fix-number-set';
							setDiv.style.cssText = `
								margin: 10px 0;
								padding: 15px;
								background: white;
								border-radius: 8px;
								border: 1px solid #ddd;
								display: flex;
								align-items: center;
								justify-content: space-between;
							`;

							setDiv.innerHTML = `
								<div>
									<strong>현재 선택수 (${randomNum1.length}개):</strong>
									<div class="number-grid" style="display: inline-flex; gap: 5px; margin-left: 10px;">
										${randomNum1.map(num => `<div class="number-ball ${getBallColorClass(num)}" style="width: 30px; height: 30px; font-size: 0.8rem;">${num}</div>`).join('')}
									</div>
								</div>
							`;

							container.appendChild(setDiv);
						}
					}

					// 선택수 초기화
					function clearSelectNumbers() {
						randomNum1 = [];
						renderSelectNumbers();
						Swal.fire({
							icon: 'success',
							title: '선택수 초기화',
							text: '선택수가 초기화되었습니다.',
							timer: 1500,
							showConfirmButton: false,
						});
					}

					// 고정수 초기화
					function clearFixNumbers() {
						selectedFixNumbers.clear();
						fixNumberSets = [];
						renderFixNumberSets();

						// 버튼 텍스트를 "고정수 선택"으로 변경
						const fixNumberBtn = document.getElementById('fixNumberBtn');
						fixNumberBtn.textContent = '고정수 선택';

						Swal.fire({
							icon: 'success',
							title: '고정수 초기화',
							text: '선택된 고정수와 세트가 모두 초기화되었습니다.',
							timer: 1500,
							showConfirmButton: false,
						});
					}

					// 최근 5주간 데이터 가져오기 (기존 데이터에 추가)
					function loadRecentData() {
						// 로딩 표시
						const loadingText = document.createElement('div');
						loadingText.innerHTML = '<p style="text-align: center; color: #3498db; font-weight: bold;">데이터를 가져오는 중...</p>';
						document.getElementById('originalData').prepend(loadingText);

						axios
							.get('https://smok95.github.io/lotto/results/all.json')
							.then(function (response) {
								// 최근 5주 데이터 추출
								const recentData = response.data.slice(-5);
								const startRound = recentData[0].draw_no;
								const endRound = recentData[recentData.length - 1].draw_no;

								// 원본 데이터 (최초 13개 세트)
								const originalData = allArrays.slice(0, 13);

								// 기존 데이터에 추가
								recentData.forEach(item => {
									const numbers = item.numbers.sort((a, b) => a - b);
									allArrays.push(numbers);
								});

								// 반복수 계산
								const repeatNumbers = findRepeatNumbers(originalData, recentData);

								// 로딩 텍스트 제거
								loadingText.remove();

								// 화면 업데이트
								updateAllDisplays();

								// 성공 메시지 (반복수 정보 포함)
								let message = `${startRound}회차 ~ ${endRound}회차 (${recentData.length}개) 데이터가 추가되었습니다.`;
								if (repeatNumbers.length > 0) {
									message += `\n반복수: ${repeatNumbers.join(', ')} (${repeatNumbers.length}개)`;
								}

								Swal.fire({
									icon: 'success',
									title: '데이터 로드 완료!',
									text: message,
									timer: 4000,
									showConfirmButton: false,
								});
							})
							.catch(function (error) {
								// 로딩 텍스트 제거
								loadingText.remove();

								console.error('데이터 로드 실패:', error);
								Swal.fire({
									icon: 'error',
									title: '데이터 로드 실패',
									text: '최근 데이터를 가져오는데 실패했습니다. 다시 시도해주세요.',
								});
							});
					}

					// 최근 5주간 데이터만 사용 (기존 데이터 교체)
					function loadRecentDataOnly() {
						// 로딩 표시
						const loadingText = document.createElement('div');
						loadingText.innerHTML = '<p style="text-align: center; color: #3498db; font-weight: bold;">데이터를 가져오는 중...</p>';
						document.getElementById('originalData').prepend(loadingText);

						axios
							.get('https://smok95.github.io/lotto/results/all.json')
							.then(function (response) {
								// 최근 5주 데이터 추출
								const recentData = response.data.slice(-5);
								const startRound = recentData[0].draw_no;
								const endRound = recentData[recentData.length - 1].draw_no;

								// 기존 데이터를 모두 지우고 최근 데이터만 사용
								allArrays = [];
								recentData.forEach(item => {
									const numbers = item.numbers.sort((a, b) => a - b);
									allArrays.push(numbers);
								});

								// 로딩 텍스트 제거
								loadingText.remove();

								// 화면 업데이트
								updateAllDisplays();

								// 성공 메시지
								Swal.fire({
									icon: 'success',
									title: '데이터 로드 완료!',
									text: `${startRound}회차 ~ ${endRound}회차 (${recentData.length}개) 데이터로 교체되었습니다.`,
									timer: 3000,
									showConfirmButton: false,
								});
							})
							.catch(function (error) {
								// 로딩 텍스트 제거
								loadingText.remove();

								console.error('데이터 로드 실패:', error);
								Swal.fire({
									icon: 'error',
									title: '데이터 로드 실패',
									text: '최근 데이터를 가져오는데 실패했습니다. 다시 시도해주세요.',
								});
							});
					}

					// 초기화
					function init() {
						// 페이지 로드 시 최근 5주 데이터를 자동으로 가져와서 히트맵에 반영
						loadRecentDataForHeatmap();
					}

					// 히트맵용 최근 5주 데이터 로드 (자동)
					function loadRecentDataForHeatmap() {
						axios
							.get('https://smok95.github.io/lotto/results/all.json')
							.then(function (response) {
								// 최근 5주 데이터 추출
								const recentData = response.data.slice(-5);

								// 히트맵에만 반영하기 위해 임시로 데이터 추가
								const tempArrays = [...allArrays];
								recentData.forEach(item => {
									const numbers = item.numbers.sort((a, b) => a - b);
									tempArrays.push(numbers);
								});

								// 히트맵만 업데이트
								renderHeatmapWithData(tempArrays);

								// 나머지 화면은 원본 데이터로 업데이트
								updateAllDisplays();
							})
							.catch(function (error) {
								console.error('최근 데이터 로드 실패:', error);
								// 실패해도 기본 화면은 표시
								updateAllDisplays();
							});
					}

					// 히트맵만 특정 데이터로 렌더링
					function renderHeatmapWithData(dataArrays) {
						const container = document.getElementById('heatmap');
						container.innerHTML = '';

						const frequencyMap = new Map();
						dataArrays.flat().forEach(num => {
							frequencyMap.set(num, (frequencyMap.get(num) || 0) + 1);
						});

						for (let i = 1; i <= 45; i++) {
							const ball = document.createElement('div');
							const frequency = frequencyMap.get(i) || 0;

							// 출현 빈도에 따른 색상 클래스 적용
							if (frequency >= 5) {
								ball.className = 'number-ball common';
							} else if (frequency >= 3) {
								ball.className = 'number-ball frequent';
							} else if (frequency >= 1) {
								ball.className = 'number-ball normal';
							} else {
								ball.className = 'number-ball rare';
							}

							ball.textContent = i;
							ball.title = `번호 ${i}: ${frequency}회 출현`;
							container.appendChild(ball);
						}
					}

					// 페이지 로드 시 초기화
					document.addEventListener('DOMContentLoaded', init);
				</script>
			</body>
		</html>
	</body>
</html>
